<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <title>Mr. Electric-Simulate</title>

  <link rel="stylesheet" href="style.css">
</head>
<body class = "page-simulate">

<header>
  <p class="brand">Mr. Electric!</p>
  <p class="tagline">Griffiths chapter 2 visualizer</p>

</header>
<section class="controls">
 <h2>Below are the options for simulation:</h2>
<label for="run-modes">Choose a Run Mode:</label>
<select name="Run Modes" id="run-modes">
    <option value="One_Charge">One-Charge Field</option>
    <option value="Two_Charge">Two-Charge Field</option>
    <option value="One_chargeGauss">Gaussian Sphere and Probe</option>
    <option value="Charged_ring">Dirac Delta Cluster</option>
    <option value="Vacuum_permittivity">Permittivity</option>
</select>




<div id="inputs-one">

    <div class="field">
    <label for="charge">Charge q (nanoCoulombs):<span id="charge-val">10</span></label>
    <input type = "range" id = "charge" name = "charge" min="-100" max="100" step="1" value="10">
    </div>

    <div class="field">
    <label for="locationx"> Location x (meters)</label>
    <input type="number" id="locationx"name="locationx"placeholder value = "0" required>
    </div>
     <div class="field">
    <label for="locationy"> Location y (meters)</label>
    <input type="number" id="locationy"name="locationy"placeholder value = "0" required>
    </div>
     <div class="field">
    <label for="locationz"> Location z (meters)</label>
    <input type="number" id="locationz"name="locationz"placeholder value = "0" required>
    </div>

    <div class="field">
    <label for="xcoordinate1">X-Coordinate of Probe (Meters):</label>
    <input type="number" id="xcoordinate1" name="X-Coordinate" placeholder value="1" required>
     </div>

    <div class="field">
    <label for="ycoordinate1">Y-Coordinate of Probe (Meters):</label>
    <input type="number" id="ycoordinate1" name="Y-Coordinate" placeholder value="0" required>
    </div>

    <div class="field">
    <label for="zcoordinate1">z-Coordinate of Probe (Meters):</label>
    <input type="number" id="zcoordinate1" name="z-Coordinate" placeholder value="0" required>
    </div>
</div>


<div id="inputs-two" style="display:none">

    <div class="field">
    <label for="charge1">Charge q1 (nanoCoulombs):<span id="charge-val1">10</span></label>
    <input type = "range" id = "charge1" name = "charge" min="-100" max="100" step="1" value="10">
        </div>
     <div class="field">
    <label for="charge2">Charge q2 (nanoCoulombs):<span id="charge-val2">-10</span></label>
    <input type = "range" id = "charge2" name = "charge" min="-100" max="100" step="1" value="-10">
         </div>
    <div class="field">
    <label for="locationx1">Location of first charge(x):</label>
    <input type = "number" id = "locationx1" name = "locationx1" placeholder value = "50" required>
        </div>
    <div class="field">
    <label for="locationy1">Location of first charge(y):</label>
    <input type = "number" id = "locationy1" name = "locationy1" placeholder value = "50" required>
        </div>
    <div class="field">
    <label for="locationz1">Location of first charge(z):</label>
    <input type = "number" id = "locationz1" name = "locationz1" placeholder value = "50" required>
        </div>
    <label for="locationx2">Location of second charge(x):</label>
    <input type = "number" id = "locationx2" name = "locationx2" placeholder value = "-50" required>
        </div>
    <div class="field">
    <label for="locationy2">Location of second charge(y):</label>
    <input type = "number" id = "locationy2" name = "locationy2" placeholder value = "-50" required>
        </div>
    <div class="field">
    <label for="locationz2">Location of second charge(z):</label>
    <input type = "number" id = "locationz2" name = "locationz2" placeholder value = "-50" required>
        </div>



    <div class="field">
    <label for="xcoordinate2">X-Coordinate of Probe (Meters):</label>
    <input type="number" id="xcoordinate2" name="X-Coordinate" placeholder value="1" required>
        </div>
    <div class="field">
    <label for="ycoordinate2">Y-Coordinate of Probe (Meters):</label>
    <input type="number" id="ycoordinate2" name="Y-Coordinate" placeholder value="0" required>
        </div>
    <div class="field">
    <label for="zcoordinate2">z-Coordinate of Probe (Meters):</label>
    <input type="number" id="zcoordinate2" name="z-Coordinate" placeholder value="0" required>
        </div>

</div>


<div id="inputs-three" style="display:none">
    <div class="field">
    <label for="chargeG">Charge q (nanoCoulombs):<span id="charge-valg">10</span></label>
    <input type="range" id="chargeG" name="charge" min="-100" max="100" step="1" value="10">
        </div>

    <div class="field">
    <label for="radius">Radius of sphere (Meters):</label>
    <input type="number" id="radius" name="radius" placeholder value="50" required>
        </div>
    <div class="field">
    <label for="locationxg"> Location x (meters)</label>
    <input type="number" id="locationxg"name="locationxg"placeholder value = "0" required>
    </div>
     <div class="field">
    <label for="locationyg"> Location y (meters)</label>
    <input type="number" id="locationyg"name="locationyg"placeholder value = "0" required>
    </div>
     <div class="field">
    <label for="locationzg"> Location z (meters)</label>
    <input type="number" id="locationzg"name="locationzg"placeholder value = "0" required>
    </div>
    <div class="field">
    <label for="xcoordinate3">X-Coordinate of Probe (Meters):</label>
    <input type="number" id="xcoordinate3" name="X-Coordinate" placeholder value="1" required>
        </div>
    <div class="field">
    <label for="ycoordinate3">Y-Coordinate of Probe (Meters):</label>
    <input type="number" id="ycoordinate3" name="Y-Coordinate" placeholder value="0" required>
        </div>
    <div class="field">
    <label for="zcoordinate3">z-Coordinate of Probe (Meters):</label>
    <input type="number" id="zcoordinate3" name="z-Coordinate" placeholder value="0" required>
        </div>
</div>

<div id="inputs-four" style="display:none">
    <div class="field">
    <label for="chargeD">Charge q (nanoCoulombs):</label>
    <input type="number" id="chargeD" name="charge" placeholder value="10" required>
        </div>
    <div class="field">
    <label for="locationxr">x-Coordinate of Probe (Meters):</label>
    <input type="number" id="locationxr" name="x-Coordinate" placeholder value="0" required>
    </div>
    <div class="field">
    <label for="locationyr">y-Coordinate of Probe (Meters):</label>
    <input type="number" id="locationyr" name="y-Coordinate" placeholder value="0" required>
    </div>
    <div class="field">
    <label for="locationzr">x-Coordinate of Probe (Meters):</label>
    <input type="number" id="locationzr" name="z-Coordinate" placeholder value="0" required>
    </div>
</div>

    <div id="inputs-five" style="display:none">
     <div class="field">
    <label for="chargep">Charge q (nanoCoulombs):<span id="charge-valp">10</span></label>
    <input type = "range" id = "chargep" name = "charge" min="-100" max="100" step="1" value="10">
    </div>

    <div class="field">
    <label for="locationxp"> Location x (meters)</label>
    <input type="number" id="locationxp"name="locationx"placeholder value = "0" required>
    </div>
     <div class="field">
    <label for="locationyp"> Location y (meters)</label>
    <input type="number" id="locationyp"name="locationy"placeholder value = "0" required>
    </div>
     <div class="field">
    <label for="locationzp"> Location z (meters)</label>
    <input type="number" id="locationzp"name="locationz"placeholder value = "0" required>
    </div>

    <div class="field">
    <label for="xcoordinate1p">X-Coordinate of Probe (Meters):</label>
    <input type="number" id="xcoordinate1p" name="X-Coordinate" placeholder value="1" required>
     </div>

    <div class="field">
    <label for="ycoordinate1p">Y-Coordinate of Probe (Meters):</label>
    <input type="number" id="ycoordinate1p" name="Y-Coordinate" placeholder value="0" required>
    </div>

    <div class="field">
    <label for="zcoordinate1p">z-Coordinate of Probe (Meters):</label>
    <input type="number" id="zcoordinate1p" name="z-Coordinate" placeholder value="0" required>
    <div class="field">
    <label for="permittivity">Choose Permittivity:</label>
    <select name="permittivity" id="permittivity">
        <option value="1.0">Free Space</option>
        <option value="1.0006">Air</option>
        <option value="1.00007">Helium</option>
        <option value="2.1">Teflon</option>
        <option value="3.0">Paper</option>
        <option value="8.0">Glass</option>
        <option value="24.3">Ethanol</option>
        <option value="80.0">Pure Water (no electrolytes)</option>
        <option value="130.0">Titanium Dioxide</option>


    </select>


    </div>
    </div>


    </div>

<button type="button" class = "btn btn-blue" id="simulate-btn">Run Simulation</button>

</section>

    <div id = "display-plot">Results of Simulation:</div>

<section class="Plot stage">
 <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

</section>

<div id="plot" style="width: 90vw; height: 500px;"></div>

</html>
